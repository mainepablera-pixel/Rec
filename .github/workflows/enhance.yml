name: Enhance voice clips

on:
  workflow_dispatch:

jobs:
  enhance:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert originals to WAV
        run: |
          mkdir -p work/in work/enh work/dn 3-final
          for f in 1-originals/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); b="${b%.*}"
            ffmpeg -loglevel error -y -i "$f" -ac 1 -ar 44100 "work/in/$b.wav"
          done
          ls -la work/in

      - name: Install Resemble Enhance
        run: |
          python -m pip install --upgrade pip
          pip install resemble-enhance --upgrade --pre
          pip install "huggingface_hub<0.26"
          pip show -f resemble-enhance | head -40
          if command -v resemble_enhance >/dev/null; then
            echo "RE=resemble_enhance" >> "$GITHUB_ENV"
          else
            echo "CLI script not found, using python -m instead"
            echo "RE=python -m resemble_enhance.enhancer" >> "$GITHUB_ENV"
          fi

      - name: Run full enhance (CPU)
        run: $RE work/in work/enh --device cpu

      - name: Run denoise only (CPU)
        run: $RE work/in work/dn --denoise_only --device cpu

      - name: Build comparison versions
        run: |
          bash finish.sh work/in  3-final finish D_original_finish
          bash finish.sh work/enh 3-final level  A_enhance
          bash finish.sh work/dn  3-final finish B_denoise_finish
          bash finish.sh work/enh 3-final finish C_enhance_finish
          ls -la 3-final

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-clips
          path: 3-final/*.wav
